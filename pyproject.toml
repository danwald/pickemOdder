[project]
name = "pickemOdder"
version = "1.0.1"
description = "Parse input game stats and output rank ordered picks"
authors = [
    {name = "danny crasto", email = "danwald79@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pytz",
    "requests",
]

[project.scripts]
pickemOdder = "pickemOdder.cli:main"
getOddsData = "pickemOdder.getoddsdata:main"

[project.urls]
Homepage = "https://github.com/danwald/pickemOdder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
]
